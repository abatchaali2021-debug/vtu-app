{% extends "base.html" %}
{% block content %}

<div class="card">
    <h2>🌐 Buy Data</h2>

    {% if success %}
        <div class="success">{{ success }}</div>
    {% endif %}

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <div class="balance-box">
        <p>Available Balance</p>
        <h1>₦{{ "%.2f"|format(user.balance) }}</h1>
    </div>

    <form method="POST">
        <label>Select Network:</label>
        <select name="network" required>
            <option value="">-- Select Network --</option>
            <option value="mtn">MTN</option>
            <option value="airtel">Airtel</option>
            <option value="glo">Glo</option>
            <option value="9mobile">9mobile</option>
        </select>

        <label>Phone Number:</label>
        <input type="text" name="phone"
               placeholder="e.g. 08012345678"
               required>

        <label>Select Plan:</label>
        <select name="variation_code" required>
            <option value="">-- Select Plan --</option>
            {% if data_plans %}
                {% for network, plans in data_plans.items() %}
                    <optgroup label="{{ network|upper }}">
                        {% for p in plans %}
                            <option value="{{ p.code }}" data-amount="{{ p.amount }}">
                                {{ p.plan }} - ₦{{ p.amount }}
                            </option>
                        {% endfor %}
                    </optgroup>
                {% endfor %}
            {% endif %}
        </select>

        <label>Amount (₦):</label>
        <input type="number" name="amount"
               placeholder="Auto-filled by plan"
               min="100" required>

        <button class="btn" type="submit">
            Buy Data
        </button>
    </form>

    <br>
    <a href="/dashboard" class="btn btn-red">
        ⬅ Back to Dashboard
    </a>
</div>

{% endblock %}
